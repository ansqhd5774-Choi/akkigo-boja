name: Deploy Worker
on:
  workflow_dispatch:
  push:
    branches: [codex/blogger-worker-r1]
    paths: [src/**, data/**, theme/assets/**, migrations/**, wrangler.jsonc, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, .github/workflows/deploy.yml]
permissions:
  contents: read
concurrency:
  group: production-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check Cloudflare API token
        id: auth
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN_MISSING"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN_PRESENT"
          fi
      - uses: actions/checkout@v7.0.1
        if: steps.auth.outputs.ready == 'true'
      - uses: actions/setup-node@v7.0.0
        if: steps.auth.outputs.ready == 'true'
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
        if: steps.auth.outputs.ready == 'true'
      - run: pnpm install --frozen-lockfile
        if: steps.auth.outputs.ready == 'true'
      - run: pnpm test
        if: steps.auth.outputs.ready == 'true'
      - name: Resolve one Cloudflare account without logging account details
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set +e
          pnpm exec wrangler whoami > "$RUNNER_TEMP/wrangler-whoami.txt" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            if grep -qi "More than one account" "$RUNNER_TEMP/wrangler-whoami.txt"; then
              echo "CLOUDFLARE_ACCOUNT_AMBIGUOUS"
            else
              echo "CLOUDFLARE_ACCOUNT_RESOLUTION_FAILED"
            fi
            exit "$code"
          fi
          echo "CLOUDFLARE_ACCOUNT_RESOLVED"
      - run: pnpm exec wrangler d1 migrations apply akkigo-boja-state --remote
        if: steps.auth.outputs.ready == 'true'
      - run: pnpm deploy
        if: steps.auth.outputs.ready == 'true'
