name: Deploy Worker
on:
  workflow_dispatch:
  push:
    branches: [codex/blogger-worker-r1]
    paths: [src/**, data/**, theme/assets/**, migrations/**, wrangler.jsonc, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, .github/workflows/deploy.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: production-worker
  queue: max
  cancel-in-progress: false
defaults:
  run:
    shell: cmd
jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, akkigo-boja]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Check Cloudflare API token
        run: node tools/actions-runtime.mjs auth
      - name: Check Worker deployment readiness
        id: worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/actions-runtime.mjs worker
      - name: Look up exact SHA full verification
        id: verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/verification-reuse.mjs
      - uses: pnpm/action-setup@v4
        if: steps.verification.outputs.reused != 'true' || steps.worker.outputs.deploy_needed == 'true'
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
        if: steps.verification.outputs.reused != 'true' || steps.worker.outputs.deploy_needed == 'true'
      - name: Source tests
        if: steps.verification.outputs.reused != 'true'
        run: node --test
      - name: Worker dry-run build
        if: steps.verification.outputs.reused != 'true'
        run: pnpm build
      - name: Regenerate Blogger theme and require clean diff
        if: steps.verification.outputs.reused != 'true'
        run: |
          node tools/build-theme.mjs
          if errorlevel 1 exit /b 1
          git diff --exit-code -- akkigo_blogger_r1_bundle/theme/blogger-theme-r1.xml
      - name: Validate Blogger XML
        if: steps.verification.outputs.reused != 'true'
        run: node tools/validate-theme-xml.mjs
      - run: pnpm exec wrangler d1 migrations apply akkigo-boja-state --remote
        if: steps.worker.outputs.deploy_needed == 'true'
      - run: pnpm deploy
        if: steps.worker.outputs.deploy_needed == 'true'
