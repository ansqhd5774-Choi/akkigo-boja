name: Verify Official Aqualand Icon
on:
  push:
    branches: [codex/blogger-worker-r1]
    paths: [.github/workflows/check-aqualand-icon.yml]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: cmd
jobs:
  icon:
    runs-on: [self-hosted, Windows, X64, akkigo-boja]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Verify Aqualand Korean Apple App Store icon
        run: node tools/icon-checks/check-aqualand-icon.mjs
