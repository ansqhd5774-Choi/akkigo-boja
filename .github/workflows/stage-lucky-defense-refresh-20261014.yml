name: Stage Lucky Defense Refresh 20261014

on:
  push:
    branches: [codex/blogger-worker-r1]
    paths:
      - '.github/workflows/stage-lucky-defense-refresh-20261014.yml'
      - 'tools/stage-lucky-defense-refresh-20261014.mjs'

permissions:
  contents: write

concurrency:
  group: stage-lucky-defense-refresh-20261014
  cancel-in-progress: false

jobs:
  stage:
    if: github.event.repository.private == false && github.repository == 'ansqhd5774-Choi/akkigo-boja'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: codex/blogger-worker-r1
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Apply 2026-10-14 worldwide recheck to existing article source
        run: node tools/stage-lucky-defense-refresh-20261014.mjs
      - name: Validate Lucky Defense source and 31-record preservation
        run: node --test tests/lucky-defense-draft.test.js
      - name: Validate shared presentation contract
        run: node tools/check-article-presentation.mjs --static
      - name: Regenerate checked-in Blogger theme source snapshots
        run: node tools/build-theme.mjs
      - name: Commit refreshed source and generated output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982+github-actions[bot]@users.noreply.github.com"
          git add data/articles-supplemental.json drafts/lucky-defense-codes-202610.html akkigo_blogger_r1_bundle/theme/blogger-theme-r1.xml
          if git diff --cached --quiet; then
            echo "LUCKY_DEFENSE_NO_DIFF"
            exit 0
          fi
          git commit -m "refresh(lucky-defense): worldwide recheck 2026-10-14"
          git push origin HEAD:codex/blogger-worker-r1
