name: Verify Blogger Layout
on:
  workflow_dispatch:
  push:
    branches: [codex/blogger-worker-r1]
    paths:
      - drafts/shibarpg-pickup-202610.html
      - akkigo_blogger_r1_bundle/theme/blogger-theme-r1.xml
      - tools/check-shiba-layout.mjs
      - tools/check-shiba-feed-layout.mjs
      - .github/workflows/verify-layout.yml
  pull_request:
    paths:
      - drafts/shibarpg-pickup-202610.html
      - akkigo_blogger_r1_bundle/theme/blogger-theme-r1.xml
      - tools/check-shiba-layout.mjs
      - tools/check-shiba-feed-layout.mjs
      - .github/workflows/verify-layout.yml
permissions:
  contents: read
defaults:
  run:
    shell: cmd
jobs:
  layout:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, akkigo-boja]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Render Shiba coupon layout at 390 and 1440
        run: node tools/run-layout-checks.mjs
