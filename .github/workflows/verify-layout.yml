name: Verify Blogger Layout
on:
  workflow_dispatch:
  push:
    branches: [codex/blogger-worker-r1]
    paths:
      - drafts/shibarpg-pickup-202610.html
      - akkigo_blogger_r1_bundle/theme/blogger-theme-r1.xml
      - tools/check-shiba-layout.mjs
      - theme/article-compact.css
      - theme/coupon-copy.js
      - theme/coupon-copy.css
      - data/articles.json
      - data/articles-supplemental.json
      - theme/article-typography.css
      - src/game-period-article.js
      - data/game-period-articles.json
      - tools/check-shiba-feed-layout.mjs
      - tools/check-site-tools-layout.mjs
      - tools/render-site-fixture.mjs
      - tools/run-layout-checks.mjs
      - .github/workflows/verify-layout.yml
  pull_request:
    paths:
      - drafts/shibarpg-pickup-202610.html
      - akkigo_blogger_r1_bundle/theme/blogger-theme-r1.xml
      - tools/check-shiba-layout.mjs
      - theme/article-compact.css
      - theme/coupon-copy.js
      - theme/coupon-copy.css
      - data/articles.json
      - data/articles-supplemental.json
      - theme/article-typography.css
      - src/game-period-article.js
      - data/game-period-articles.json
      - tools/check-shiba-feed-layout.mjs
      - tools/check-site-tools-layout.mjs
      - tools/render-site-fixture.mjs
      - tools/run-layout-checks.mjs
      - .github/workflows/verify-layout.yml
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  layout:
    if: github.event.repository.private == false && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Render shared period coupon and site fixtures at 390 and 1440
        run: node tools/run-layout-checks.mjs
