name: Public SEO Check
on:
  workflow_dispatch:
  push:
    branches: [codex/blogger-worker-r1]
    paths:
      - tools/check-public-seo.mjs
      - tools/audit-search-foundation.mjs
      - src/search-audit.js
      - .github/workflows/public-seo.yml
permissions:
  contents: read
defaults:
  run:
    shell: cmd
jobs:
  seo:
    if: github.event.repository.private == false
    # Google blocks hosted runner IPs (429); this read-only check needs local egress.
    runs-on: [self-hosted, Windows, X64, akkigo-boja]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: node tools/check-public-seo.mjs
      - name: Audit public article metadata and static discovery
        if: always()
        run: node tools/audit-search-foundation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-foundation-audit
          path: output/search-foundation-audit.json
