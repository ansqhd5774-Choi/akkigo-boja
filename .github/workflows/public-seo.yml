name: Public SEO Check
on:
  workflow_dispatch:
  push:
    branches: [codex/blogger-worker-r1]
    paths:
      - tools/check-public-seo.mjs
      - .github/workflows/public-seo.yml
permissions:
  contents: read
defaults:
  run:
    shell: cmd
jobs:
  seo:
    runs-on: [self-hosted, Windows, X64, akkigo-boja]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: node tools/check-public-seo.mjs
