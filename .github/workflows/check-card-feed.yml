name: Check public card feed
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production category payloads
        run: node tools/check-card-feed.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-feed-runtime
          path: output/card-feed-runtime.json
