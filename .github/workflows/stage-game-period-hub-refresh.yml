name: Stage Game Period Hub Refresh

on:
  push:
    branches: [codex/blogger-worker-r1]
    paths:
      - 'data/game-period-hub-refreshes/**'
      - 'tools/apply-game-period-hub-refresh.mjs'
      - '.github/workflows/stage-game-period-hub-refresh.yml'

permissions:
  contents: write

concurrency:
  group: stage-game-period-hub-refresh
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  stage:
    if: github.event.repository.private == false && github.repository == 'ansqhd5774-Choi/akkigo-boja'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Apply changed declarative hub refreshes
        id: refresh
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          mapfile -t files < <(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER" -- data/game-period-hub-refreshes | grep -E '^data/game-period-hub-refreshes/[a-z0-9-]+\.json$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "has_refresh=false" >> "$GITHUB_OUTPUT"
            echo "GAME_PERIOD_HUB_REFRESH_NO_DATA_CHANGE"
            exit 0
          fi
          echo "has_refresh=true" >> "$GITHUB_OUTPUT"
          node tools/apply-game-period-hub-refresh.mjs "${files[@]}"
      - name: Validate shared period source before commit
        if: steps.refresh.outputs.has_refresh == 'true'
        run: node tools/check-article-presentation.mjs --static
      - name: Commit generated canonical hub source once
        id: generated
        if: steps.refresh.outputs.has_refresh == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982+github-actions[bot]@users.noreply.github.com"
          git add data/game-period-hubs.json drafts/zeus.json drafts/zeus.html drafts/lineagem.json drafts/lineagem.html drafts/wuthering.json drafts/wuthering.html akkigo_blogger_r1_bundle/theme/blogger-theme-r1.xml akkigo_blogger_r1_bundle/theme/blogger-theme-r1_modified.xml
          if git diff --cached --quiet; then
            echo "GAME_PERIOD_HUB_REFRESH_NO_GENERATED_DIFF"
            echo "generated_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "refresh(game): apply declarative hub update"
          git push origin HEAD:codex/blogger-worker-r1
          generated_sha="$(git rev-parse HEAD)"
          echo "generated_sha=$generated_sha" >> "$GITHUB_OUTPUT"
          echo "GAME_PERIOD_HUB_REFRESH_GENERATED_SHA $generated_sha"

          # The generated push starts Verify exactly once. A successful Verify then
          # starts Deploy Worker through workflow_run. Do not dispatch either here.
