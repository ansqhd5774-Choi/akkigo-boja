name: Reconcile Nomad Removed State
on:
  push:
    branches: [codex/blogger-worker-r1]
    paths:
      - .github/workflows/reconcile-nomad-removed.yml
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  reconcile:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - name: Verify exact stale state before mutation
        run: |
          pnpm exec wrangler d1 execute akkigo-boja-state --remote --json --command "SELECT article_key,post_id,public_url,status FROM article_state WHERE article_key='nomad-esim-promo-202610';" > before.json
          node <<'NODE'
          const fs=require('node:fs');
          const payload=JSON.parse(fs.readFileSync('before.json','utf8'));
          const rows=payload.flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          const row=rows[0];
          const expected={article_key:'nomad-esim-promo-202610',post_id:'6160252340041053056',public_url:'https://lsifl.blogspot.com/2026/10/nomad-esim-2026-10-20-5.html',status:'LIVE'};
          if(rows.length!==1 || !row || Object.keys(expected).some(k=>row[k]!==expected[k])){
            console.error('NOMAD_STATE_PREFLIGHT_MISMATCH');
            process.exit(1);
          }
          console.log('NOMAD_STATE_PREFLIGHT_OK');
          NODE
      - name: Reconcile D1 state without touching Blogger
        run: |
          pnpm exec wrangler d1 execute akkigo-boja-state --remote --json --command "UPDATE article_state SET status='REMOVED',updated_at=strftime('%Y-%m-%dT%H:%M:%fZ','now') WHERE article_key='nomad-esim-promo-202610' AND post_id='6160252340041053056' AND public_url='https://lsifl.blogspot.com/2026/10/nomad-esim-2026-10-20-5.html' AND status='LIVE'; SELECT changes() AS changed;" > update.json
          node <<'NODE'
          const fs=require('node:fs');
          const payload=JSON.parse(fs.readFileSync('update.json','utf8'));
          const rows=payload.flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          const change=rows.find(r=>Object.prototype.hasOwnProperty.call(r,'changed'));
          if(!change || Number(change.changed)!==1){
            console.error('NOMAD_STATE_UPDATE_NOT_EXACTLY_ONE');
            process.exit(1);
          }
          console.log('NOMAD_STATE_UPDATE_ONE_ROW');
          NODE
      - name: Verify reconciled state and identifiers
        run: |
          pnpm exec wrangler d1 execute akkigo-boja-state --remote --json --command "SELECT article_key,post_id,public_url,status FROM article_state WHERE article_key='nomad-esim-promo-202610';" > after.json
          node <<'NODE'
          const fs=require('node:fs');
          const payload=JSON.parse(fs.readFileSync('after.json','utf8'));
          const rows=payload.flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          const row=rows[0];
          const expected={article_key:'nomad-esim-promo-202610',post_id:'6160252340041053056',public_url:'https://lsifl.blogspot.com/2026/10/nomad-esim-2026-10-20-5.html',status:'REMOVED'};
          if(rows.length!==1 || !row || Object.keys(expected).some(k=>row[k]!==expected[k])){
            console.error('NOMAD_STATE_POSTCHECK_FAILED');
            process.exit(1);
          }
          console.log('NOMAD_STATE_RECONCILED_REMOVED');
          NODE
      - name: Confirm removed article is not publicly serving its article marker
        run: |
          url='https://lsifl.blogspot.com/2026/10/nomad-esim-2026-10-20-5.html'
          status=$(curl --location --silent --show-error --output nomad-public.html --write-out '%{http_code}' "$url")
          if grep -Fq 'data-ncp-article="nomad-esim-promo-202610"' nomad-public.html; then
            echo "NOMAD_PUBLIC_MARKER_STILL_PRESENT status=$status"
            exit 1
          fi
          echo "NOMAD_PUBLIC_REMOVAL_CONFIRMED status=$status"
