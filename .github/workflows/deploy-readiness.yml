name: Deploy Readiness
on:
  workflow_dispatch:
  push:
    branches: [codex/blogger-worker-r1]
    paths:
      - .github/workflows/deploy-readiness.yml
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment prerequisite without exposing values
        env:
          API_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "api_token_present=$API_TOKEN_PRESENT"
          echo "account_selection=WRANGLER_AUTO_SELECT_SINGLE_SCOPED_ACCOUNT"
