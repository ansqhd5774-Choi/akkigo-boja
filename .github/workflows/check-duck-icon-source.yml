name: Check Official Duck Survival App Icon
on:
  push:
    branches: [codex/blogger-worker-r1]
    paths: [.github/workflows/check-duck-icon-source.yml]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: cmd
jobs:
  official-icon:
    runs-on: [self-hosted, Windows, X64, akkigo-boja]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Retrieve Apple App Store official icon URL
        run: node tools/icon-checks/check-duck-icon-source.mjs
