name: Temporary Remaining Logo Probe
on:
  push:
    branches: [codex/blogger-worker-r1]
    paths: [.github/workflows/logo-source-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Inspect Duolingo press logo bundle references read-only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://press.duolingo.com/';
          const r=await fetch(base,{headers:{'user-agent':'Mozilla/5.0 LogoAudit/1.0'},signal:AbortSignal.timeout(20000)});
          const html=await r.text();
          const scripts=[...html.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m=>new URL(m[1],r.url).href);
          console.log('PRESS',r.status,r.url,scripts);
          for(const url of scripts){
            const x=await fetch(url,{headers:{'user-agent':'Mozilla/5.0 LogoAudit/1.0'},signal:AbortSignal.timeout(20000)});
            const text=await x.text();
            if(!/(press kit|logos?|logotype|lockup)/i.test(text))continue;
            console.log('BUNDLE',url,'bytes',text.length);
            const terms=['Press Kit','Logos','logo','logotype','lockup'];
            for(const term of terms){
              let pos=0,count=0;
              while((pos=text.toLowerCase().indexOf(term.toLowerCase(),pos))>=0&&count++<12){
                const s=Math.max(0,pos-700),e=Math.min(text.length,pos+1400);
                console.log('CTX',term,text.slice(s,e).replace(/\s+/g,' '));pos+=term.length;
              }
            }
            const urls=new Set();
            for(const m of text.matchAll(/(?:https?:\\?\/\\?\/[^"'`\s)]+|["'`]([^"'`\s]+\.(?:svg|png|webp|jpe?g)(?:\?[^"'`\s]*)?)["'`])/gi)){
              const raw=(m[1]||m[0]).replaceAll('\\/','/').replace(/^['"`]|['"`]$/g,'');
              try{const u=new URL(raw,url).href;if(/duolingo|logo|lockup|press|asset|static|media/i.test(u))urls.add(u)}catch{}
            }
            for(const u of [...urls].slice(0,100))console.log('IMAGEURL',u);
          }
          NODE
