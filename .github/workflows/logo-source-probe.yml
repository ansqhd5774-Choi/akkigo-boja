name: Temporary Official Logo Source Probe
on:
  push:
    branches: [codex/blogger-worker-r1]
    paths: [.github/workflows/logo-source-probe.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Validate selected official logo assets read-only
        run: |
          node --input-type=module <<'NODE'
          const targets={
            gigago:'https://gigago.com/wp-content/uploads/2022/09/gigago-logo-new.svg',
            eskimo:'https://www.eskimo.travel/image_landing/logo-blue.png',
            gomoworld:'https://www.gomoworld.com/static/images/logo-red.webp',
            keepgo:'https://cdn.shopify.com/s/files/1/0546/0449/files/logo_header_90x42px.png?5449809845600272201',
            globalyo:'https://www.globalyo.com/images/logos/logo.svg',
            inflearn:'https://cdn.inflearn.com/assets/images/header/inflearn_logo_default.svg',
            maaltalk:'https://shop.maaltalk.com/static/version1756833090/frontend/dial070/maaltalknow/en_US/images/logo.svg',
            ip4u:'https://www.ip4u.co.kr/res/img/logo_footer.png',
            gigaip:'https://gigaip.net/resources/img/top_logo.png',
            ohmyzip:'https://www.ohmyzip.com/images2026/main/ohmyzip_logo.png',
            twofasts:'https://www.2fasts.com/images/common/copyright_logo.png'
          };
          async function check(name,url){
            try{
              const r=await fetch(url,{redirect:'follow',headers:{'user-agent':'Mozilla/5.0 LogoAudit/1.0','accept':'image/avif,image/webp,image/svg+xml,image/png,image/*,*/*;q=0.8'},signal:AbortSignal.timeout(12000)});
              const type=(r.headers.get('content-type')||'').toLowerCase();
              const buf=await r.arrayBuffer();
              const ok=r.ok && (type.startsWith('image/') || /\.svg(?:[?#]|$)/i.test(r.url)) && buf.byteLength>100;
              console.log(`LOGO_ASSET ${name} status=${r.status} type=${type||'none'} bytes=${buf.byteLength} ok=${ok} url=${r.url}`);
              if(!ok)process.exitCode=1;
            }catch(e){console.log(`LOGO_ASSET ${name} error=${String(e?.name||'ERROR')} ok=false url=${url}`);process.exitCode=1;}
          }
          await Promise.all(Object.entries(targets).map(([name,url])=>check(name,url)));
          NODE
