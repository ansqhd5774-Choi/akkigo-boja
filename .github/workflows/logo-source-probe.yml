name: Temporary Remaining Logo Probe
on:
  push:
    branches: [codex/blogger-worker-r1]
    paths: [.github/workflows/logo-source-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Inspect Duolingo and FromBIO official logo sources read-only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const targets={
            duolingo:'https://design.duolingo.com/identity/logos',
            duolingoPress:'https://press.duolingo.com/',
            frombioCI:'https://company.frombio.co.kr/default/en/frombio/page04.php',
            frombioShop:'https://www.frombio.co.kr/'
          };
          const kw=/(logo|logotype|lockup|duolingo|frombio|ci|symbol)/i;
          function abs(v,b){try{if(!v||/^(data|javascript):/i.test(v))return null;return new URL(v.replace(/&amp;/g,'&'),b).href}catch{return null}}
          for(const [name,url] of Object.entries(targets)){
            try{
              const r=await fetch(url,{redirect:'follow',headers:{'user-agent':'Mozilla/5.0 LogoAudit/1.0','accept':'text/html,application/xhtml+xml'},signal:AbortSignal.timeout(15000)});
              const html=await r.text(); console.log(`PAGE ${name} ${r.status} ${r.url} bytes=${html.length}`);
              for(const m of html.matchAll(/<(?:img|source|link|meta|a)[^>]*>/gi)){
                const tag=m[0]; if(!kw.test(tag))continue;
                const attrs=[...tag.matchAll(/(?:src|srcset|href|content)\s*=\s*["']([^"']+)["']/gi)].map(x=>x[1]);
                for(const raw of attrs){for(const part of raw.split(',').map(x=>x.trim().split(/\s+/)[0])){const u=abs(part,r.url);if(u)console.log(`CANDIDATE ${name} ${u} CONTEXT ${tag.slice(0,800).replace(/\s+/g,' ')}`)}}
              }
              for(const m of html.matchAll(/["'(=:\s]([^"'()\s<>]{0,260}(?:logo|logotype|lockup|frombio|duolingo)[^"'()\s<>]{0,260}\.(?:svg|png|webp|jpe?g)(?:\?[^"'()\s<>]*)?)/gi)){
                const u=abs(m[1],r.url);if(u)console.log(`RAW ${name} ${u}`);
              }
            }catch(e){console.log(`ERROR ${name} ${url} ${e.name}`)}
          }
          NODE
