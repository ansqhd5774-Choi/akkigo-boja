name: Temporary Remaining Logo Probe
on:
  push:
    branches: [codex/blogger-worker-r1]
    paths: [.github/workflows/logo-source-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Resolve Duolingo official Press Room header logo asset read-only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url='https://press.duolingo.com/main.1fa341056a8e1b7872a8.js';
          const r=await fetch(url,{headers:{'user-agent':'Mozilla/5.0 LogoAudit/1.0'},signal:AbortSignal.timeout(15000)});
          const text=await r.text();
          console.log('BUNDLE',r.status,r.url,'bytes='+text.length);
          for(const needle of ['alt:"Duolingo",src:ia','ia=a.p+','ia=','Duolingo Press Room']){
            let p=0,n=0;while((p=text.indexOf(needle,p))>=0&&n++<8){console.log('CTX',needle,text.slice(Math.max(0,p-1200),Math.min(text.length,p+1600)));p+=needle.length}
          }
          for(const m of text.matchAll(/(?:^|[,;])([A-Za-z_$][\w$]*)=a\.p\+"([a-f0-9]{20,}\.(?:svg|png|webp))"/g)){
            if(['ia','nl','sl','yi','bi','wi','Ei'].includes(m[1]))console.log('MAP',m[1],`https://press.duolingo.com/${m[2]}`);
          }
          NODE
