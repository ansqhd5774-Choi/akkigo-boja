name: Temporary Official Logo Source Probe
on:
  push:
    branches: [codex/blogger-worker-r1]
    paths: [.github/workflows/logo-source-probe.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Extract official logo asset candidates read-only
        run: |
          node --input-type=module <<'NODE'
          const targets={gigago:'https://gigago.com/',eskimo:'https://www.eskimo.travel/',gomoworld:'https://www.gomoworld.com/',keepgo:'https://www.keepgo.com/',globalyo:'https://www.globalyo.com/',dosirakesim:'https://dosirakesim.com/',duolingo:'https://design.duolingo.com/identity/logos',malhaevoca:'https://epop.ai/ko/premium',frombio:'https://www.frombio.co.kr/',inflearn:'https://www.inflearn.com/',maaltalk:'https://www.maaltalk.com/',ip4u:'https://www.ip4u.co.kr/',gigaip:'https://gigaip.net/',ohmyzip:'https://www.ohmyzip.com/index.php',twofasts:'https://www.2fasts.com/',rokebi:'https://www.rokebi.com/',esthermall:'https://www.esthermall.co.kr/'};
          function resolve(v,b){try{v=v.replace(/&amp;/g,'&').trim();if(!v||/^(?:data|javascript):/i.test(v))return null;return new URL(v,b).href}catch{return null}}
          function collect(text,base){const out=new Set();for(const re of [/(?:src|href|content)\s*=\s*["']([^"']*(?:logo|brand)[^"']*)["']/gi,/["']([^"']*(?:logo|brand)[^"']*\.(?:svg|png|webp|jpe?g|gif)(?:\?[^"']*)?)["']/gi,/url\((?:["']?)([^)"']*(?:logo|brand)[^)"']*)(?:["']?)\)/gi]){let m;while((m=re.exec(text))){const u=resolve(m[1],base);if(u)out.add(u)}}return out}
          async function probe(name,url){const lines=[];try{const r=await fetch(url,{redirect:'follow',headers:{'user-agent':'Mozilla/5.0 LogoAudit/1.0','accept':'text/html,application/xhtml+xml'},signal:AbortSignal.timeout(10000)});const text=await r.text();lines.push(`LOGO_PROBE_HTTP ${name} ${r.status} ${r.url} bytes=${text.length}`);const found=collect(text,r.url);const sheets=[...text.matchAll(/<link[^>]+href=["']([^"']+)["'][^>]*>/gi)].map(m=>resolve(m[1],r.url)).filter(Boolean).filter(x=>/\.css(?:[?#]|$)/i.test(x)).slice(0,2);await Promise.all(sheets.map(async s=>{try{const x=await fetch(s,{redirect:'follow',headers:{'user-agent':'Mozilla/5.0 LogoAudit/1.0'},signal:AbortSignal.timeout(6000)});if(x.ok)for(const c of collect(await x.text(),x.url))found.add(c)}catch{}}));const list=[...found].slice(0,20);if(!list.length)lines.push(`LOGO_PROBE_NONE ${name}`);for(const c of list)lines.push(`LOGO_CANDIDATE ${name} ${c}`)}catch(e){lines.push(`LOGO_PROBE_ERROR ${name} ${String(e?.name||'ERROR')}`)}return lines}
          const results=await Promise.all(Object.entries(targets).map(([n,u])=>probe(n,u)));
          for(const lines of results)for(const line of lines)console.log(line);
          NODE
