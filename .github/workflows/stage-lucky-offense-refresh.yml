name: Stage Lucky Offense Refresh
on:
  push:
    branches: [codex/blogger-worker-r1]
    paths:
      - data/lucky-offense-refresh-20261013.json
      - tools/stage-lucky-offense-refresh.mjs
      - tests/lucky-offense-refresh.test.js
      - .github/workflows/stage-lucky-offense-refresh.yml
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: stage-lucky-offense-refresh
  cancel-in-progress: false
jobs:
  stage:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Apply 2026-10-13 research to source-generated article
        run: node tools/stage-lucky-offense-refresh.mjs
      - name: Validate target article invariants
        run: |
          node --input-type=module -e "import {luckyOffenseArticle as x} from './src/game-batch-20261012-h.js'; import {currentArticleCatalog} from './src/article-catalog.js'; import {validateGamePeriodArticle} from './src/game-period-article.js'; if(!x)throw Error('LUCKY_OFFENSE_ARTICLE_MISSING'); if(currentArticleCatalog.find(a=>a.articleKey===x.articleKey)!==x)throw Error('LUCKY_OFFENSE_CATALOG_MISMATCH'); validateGamePeriodArticle(x); const m=x.source.gamePeriodModel; if(m.records.length!==3)throw Error('LUCKY_OFFENSE_HISTORY_COUNT_DRIFT_'+m.records.length); if(m.records.some(r=>r.latest))throw Error('LUCKY_OFFENSE_FALSE_CURRENT_CODE'); if(x.source.checkedAt!=='2026-10-13')throw Error('LUCKY_OFFENSE_CHECKED_AT_DRIFT'); if((x.source.benefits||[]).length!==2)throw Error('LUCKY_OFFENSE_BENEFIT_COUNT_DRIFT'); if(!x.post.content.includes('lucky-offense-20261013'))throw Error('LUCKY_OFFENSE_REFRESH_EVIDENCE_MISSING'); console.log('LUCKY_OFFENSE_REFRESH_INVARIANTS_PASS');"
      - name: Run Lucky Offense refresh regression tests
        run: node --test tests/lucky-offense-refresh.test.js tests/game-batch-20261012-h.test.js
      - name: Regenerate checked-in Blogger theme source snapshots
        run: |
          node tools/build-theme.mjs
          cp akkigo_blogger_r1_bundle/theme/blogger-theme-r1.xml akkigo_blogger_r1_bundle/theme/blogger-theme-r1_modified.xml
      - name: Commit refreshed source and generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982+github-actions[bot]@users.noreply.github.com"
          git add src/game-batch-20261012-h.js akkigo_blogger_r1_bundle/theme/blogger-theme-r1.xml akkigo_blogger_r1_bundle/theme/blogger-theme-r1_modified.xml
          if [ -f drafts/lucky-offense-codes-202610.html ]; then git add drafts/lucky-offense-codes-202610.html; fi
          if [ -f drafts/lucky-offense-codes-202610.json ]; then git add drafts/lucky-offense-codes-202610.json; fi
          if git diff --cached --quiet; then echo "LUCKY_OFFENSE_REFRESH_ALREADY_STAGED"; exit 0; fi
          git commit -m "refresh(lucky-offense): recheck coupons and preserve partner history"
          git push origin HEAD:codex/blogger-worker-r1
