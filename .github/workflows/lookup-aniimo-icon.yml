name: Verify Aniimo App Icon
on:
  push:
    branches: [codex/blogger-worker-r1]
    paths: [.github/workflows/lookup-aniimo-icon.yml]
permissions:
  contents: read
defaults:
  run:
    shell: cmd
jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, akkigo-boja]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Check App Store identity and icon
        run: node tools/icon-checks/lookup-aniimo-icon.mjs
