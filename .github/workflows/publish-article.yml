name: Publish Approved Article
on:
  workflow_dispatch:
    inputs:
      readonly_probe:
        description: Existing article LIVE path probe; never publishes or deploys
        type: boolean
        default: true
  push:
    branches: [codex/blogger-worker-r1]
    paths: [publish-requests/**]
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: production-worker
  queue: max
  cancel-in-progress: false
defaults:
  run:
    shell: cmd
jobs:
  publish:
    runs-on: [self-hosted, Windows, X64, akkigo-boja]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Look up exact SHA full verification
        id: verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/verification-reuse.mjs
      - uses: pnpm/action-setup@v4
        if: steps.verification.outputs.reused != 'true'
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
        if: steps.verification.outputs.reused != 'true'
      - name: Source tests
        if: steps.verification.outputs.reused != 'true'
        run: node --test
      - name: Worker dry-run build
        if: steps.verification.outputs.reused != 'true'
        run: pnpm build
      - name: Regenerate Blogger theme and require clean diff
        if: steps.verification.outputs.reused != 'true'
        run: |
          node tools/build-theme.mjs
          if errorlevel 1 exit /b 1
          git diff --exit-code -- akkigo_blogger_r1_bundle/theme/blogger-theme-r1.xml
      - name: Validate Blogger XML
        if: steps.verification.outputs.reused != 'true'
        run: node tools/validate-theme-xml.mjs
      - name: Require verified source snapshot
        env:
          VERIFIED_SOURCE_SHA: ${{ steps.verification.outputs.verified_sha || github.sha }}
        run: node tools/actions-runtime.mjs verified-source
      - name: Select requests in complete push range
        id: requests
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: node tools/select-publish-requests.mjs "%PUSH_BEFORE%" "%PUSH_AFTER%"
      - name: Request GitHub OIDC token
        if: steps.requests.outputs.has_requests == 'true' || inputs.readonly_probe == true
        id: oidc
        run: node tools/actions-runtime.mjs oidc
      - name: Read-only existing Blogger LIVE path probe
        if: github.event_name == 'workflow_dispatch' && inputs.readonly_probe == true
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: node tools/probe-blogger-live.mjs
      - name: Read-only Worker source check before repair
        if: steps.requests.outputs.has_requests == 'true'
        id: preflight
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: node tools/check-article-readiness.mjs --once
      - name: Check Worker deployment readiness
        if: steps.requests.outputs.has_requests == 'true'
        id: worker
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_READY: ${{ steps.preflight.outputs.worker_ready }}
        run: node tools/actions-runtime.mjs worker
      - uses: pnpm/action-setup@v4
        if: steps.worker.outputs.deploy_needed == 'true' && steps.verification.outputs.reused == 'true'
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
        if: steps.worker.outputs.deploy_needed == 'true' && steps.verification.outputs.reused == 'true'
      - name: Apply pending D1 migrations before repair deploy
        if: steps.worker.outputs.deploy_needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply akkigo-boja-state --remote
      - name: Repair Worker deployment when required
        if: steps.worker.outputs.deploy_needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm deploy
      - name: Refresh OIDC token after any repair deploy
        if: steps.requests.outputs.has_requests == 'true'
        id: publish-oidc
        run: node tools/actions-runtime.mjs oidc
      - name: Confirm exact Worker source before any Blogger mutation
        if: steps.requests.outputs.has_requests == 'true'
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.publish-oidc.outputs.token }}
        run: node tools/check-article-readiness.mjs --wait
      # No separate browser QA after normal publication; the user reviews the URL.
      - name: Publish only changed approved requests and return Blogger link
        if: steps.requests.outputs.has_requests == 'true'
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.publish-oidc.outputs.token }}
        run: node tools/actions-runtime.mjs publish
      - name: Summarize verification and deployment
        if: always()
        env:
          VERIFY_REUSED: ${{ steps.verification.outputs.reused }}
          VERIFY_REASON: ${{ steps.verification.outputs.reason }}
          DEPLOY_NEEDED: ${{ steps.worker.outputs.deploy_needed }}
          JOB_RESULT: ${{ job.status }}
        run: node tools/actions-summary.mjs
