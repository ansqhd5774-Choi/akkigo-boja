name: Publish Approved Article
on:
  push:
    branches: [codex/blogger-worker-r1]
    paths:
      - publish-requests/**
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: production-worker
  queue: max
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Select requests in complete push range
        id: requests
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: node tools/select-publish-requests.mjs "$PUSH_BEFORE" "$PUSH_AFTER"
      - name: Require verified source snapshot
        if: steps.requests.outputs.has_requests == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          verified=false
          for attempt in $(seq 1 30); do
            candidate_found=false
            rows="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs" -f branch="codex/blogger-worker-r1" -f per_page=100 --jq '.workflow_runs[] | [.head_sha, .status, (.conclusion // "")] | @tsv')" || {
              echo "SOURCE_VERIFY_LOOKUP_FAILED"
              exit 1
            }
            while IFS=$'\t' read -r candidate status conclusion; do
              if [ -z "$candidate" ] || ! git cat-file -e "$candidate^{commit}" 2>/dev/null; then continue; fi
              if ! git merge-base --is-ancestor "$candidate" "$GITHUB_SHA"; then continue; fi
              changed="$(git diff --name-only "$candidate" "$GITHUB_SHA")"
              if printf '%s\n' "$changed" | grep -Ev '^(docs/|publish-requests/)|\.md$' | grep -q .; then continue; fi
              candidate_found=true
              if [ "$status" = completed ] && [ "$conclusion" = success ]; then
                echo "SOURCE_SNAPSHOT_VERIFIED $candidate"
                verified=true
                break
              fi
              if [ "$status" = completed ] && [ "$conclusion" = failure ]; then
                echo "SOURCE_VERIFY_FAILED $candidate"
                exit 1
              fi
            done <<< "$rows"
            if [ "$verified" = true ]; then break; fi
            if [ "$attempt" -eq 30 ]; then
              echo "SOURCE_VERIFY_TIMEOUT"
              exit 1
            fi
            sleep 3
          done
      - name: Check Worker deployment readiness
        if: steps.requests.outputs.has_requests == 'true'
        id: worker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deploy_sha="$(git log -1 --format=%H HEAD -- src/ data/ theme/assets/ migrations/ wrangler.jsonc package.json pnpm-lock.yaml pnpm-workspace.yaml .github/workflows/deploy.yml)"

          deploy_needed=true
          if [ -n "$deploy_sha" ]; then
            mapfile -t deployed_shas < <(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs" -f branch="codex/blogger-worker-r1" -f per_page=30 --jq '.workflow_runs[] | select(.status=="completed" and .conclusion=="success") | .head_sha' 2>/dev/null || true)
            for deployed_sha in "${deployed_shas[@]}"; do
              if git cat-file -e "$deployed_sha^{commit}" 2>/dev/null &&
                 git merge-base --is-ancestor "$deploy_sha" "$deployed_sha" &&
                 git merge-base --is-ancestor "$deployed_sha" HEAD^; then
                deploy_needed=false
                echo "WORKER_ALREADY_DEPLOYED_BY_DEPLOY_WORKFLOW"
                break
              fi
            done
            if [ "$deploy_needed" = true ]; then
              mapfile -t published_shas < <(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/publish-article.yml/runs" -f branch="codex/blogger-worker-r1" -f per_page=20 --jq '.workflow_runs[] | select(.status=="completed" and .conclusion=="success") | .head_sha' 2>/dev/null || true)
              for published_sha in "${published_shas[@]}"; do
                if git cat-file -e "$published_sha^{commit}" 2>/dev/null &&
                   git merge-base --is-ancestor "$deploy_sha" "$published_sha" &&
                   git merge-base --is-ancestor "$published_sha" HEAD^; then
                  deploy_needed=false
                  echo "WORKER_ALREADY_DEPLOYED_BY_SUCCESSFUL_PUBLISH"
                  break
                fi
              done
            fi
          else
            echo "DEPLOY_SOURCE_NOT_FOUND_REPAIR_REQUIRED"
          fi
          echo "deploy_needed=$deploy_needed" >> "$GITHUB_OUTPUT"
      - run: npm install --global pnpm@11.19.0
        if: steps.worker.outputs.deploy_needed == 'true'
      - run: pnpm install --frozen-lockfile
        if: steps.worker.outputs.deploy_needed == 'true'
      - name: Apply pending D1 migrations before repair deploy
        if: steps.worker.outputs.deploy_needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply akkigo-boja-state --remote
      - name: Repair Worker deployment when required
        if: steps.worker.outputs.deploy_needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm deploy
      - name: Request GitHub OIDC token
        if: steps.requests.outputs.has_requests == 'true'
        id: oidc
        shell: bash
        run: |
          response="$(curl --fail-with-body --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=akkigo-boja-publish")"
          token="$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value||''))")"
          if [ -z "$token" ]; then echo "OIDC_TOKEN_MISSING"; exit 1; fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Publish only changed approved requests
        if: steps.requests.outputs.has_requests == 'true'
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t hub_requests < "$RUNNER_TEMP/publish-hub-paths.txt"
          mapfile -t article_requests < "$RUNNER_TEMP/publish-article-paths.txt"
          for request_file in "${hub_requests[@]}"; do
            node tools/refresh-approved-hubs.mjs "$request_file"
          done
          if [ "${#article_requests[@]}" -gt 0 ]; then
            node tools/publish-approved-requests.mjs "${article_requests[@]}"
          fi
