name: Verify
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - publish-requests/**
      - docs/**
      - '**/*.md'
  pull_request:
    paths-ignore:
      - publish-requests/**
      - docs/**
      - '**/*.md'
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Detect Worker build changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "WORKER_BUILD_REQUIRED_NON_PUSH"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "WORKER_BUILD_REQUIRED_UNCERTAIN_DIFF"
            exit 0
          fi
          files="$(git diff --name-only "$before" "$GITHUB_SHA")"
          if printf '%s\n' "$files" | grep -Eq '^(src/|data/|theme/assets/|migrations/|wrangler\.jsonc$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "WORKER_BUILD_REQUIRED"
          else
            echo "worker=false" >> "$GITHUB_OUTPUT"
            echo "WORKER_BUILD_SKIPPED"
          fi
      - run: pnpm test
      - run: pnpm build
        if: steps.changes.outputs.worker == 'true'
      - name: Regenerate Blogger theme and require clean diff
        run: |
          node tools/build-theme.mjs
          git diff --exit-code -- akkigo_blogger_r1_bundle/theme/blogger-theme-r1.xml
      - name: Validate Blogger XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in [
              'theme/blogger-native-base.xml',
              'akkigo_blogger_r1_bundle/theme/blogger-theme-r1.xml',
              'akkigo_blogger_r1_bundle/theme/blogger-theme-r1_modified.xml',
          ]:
              ET.parse(path)
              print('XML_OK', path)
          PY
