name: Verify
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      verified_sha:
        value: ${{ jobs.verify.outputs.verified_sha }}
  push:
    paths-ignore: [publish-requests/**, docs/**, '**/*.md']
  pull_request:
    paths-ignore: [publish-requests/**, docs/**, '**/*.md']
permissions:
  contents: read
defaults:
  run:
    shell: cmd
jobs:
  verify:
    if: github.repository == 'ansqhd5774-Choi/akkigo-boja' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Windows, X64, akkigo-boja]
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      verified_sha: ${{ steps.verified.outputs.verified_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Detect Worker build changes
        id: changes
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: node tools/actions-runtime.mjs changes
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: node --test
      - run: pnpm build
        if: steps.changes.outputs.worker == 'true' || github.workflow == 'Publish Approved Article'
      - name: Regenerate Blogger theme and require clean diff
        run: |
          node tools/build-theme.mjs
          if errorlevel 1 exit /b 1
          git diff --exit-code -- akkigo_blogger_r1_bundle/theme/blogger-theme-r1.xml
      - name: Validate Blogger XML
        run: node tools/validate-theme-xml.mjs
      - name: Mark exact verified source
        id: verified
        run: echo verified_sha=%GITHUB_SHA%>>"%GITHUB_OUTPUT%"
