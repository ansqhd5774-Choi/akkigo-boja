name: Verify
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      verified_sha:
        value: ${{ jobs.verify.outputs.verified_sha }}
  push:
    paths-ignore: [publish-requests/**, docs/**, '**/*.md']
  pull_request:
    paths-ignore: [publish-requests/**, docs/**, '**/*.md']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    if: github.event.repository.private == false && (github.repository == 'ansqhd5774-Choi/akkigo-boja' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      verified_sha: ${{ steps.verified.outputs.verified_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Source tests
        # Mandatory presentation gate also checks generated theme typography.
        run: node --test
      - name: Enforce R2 DOM structure, legacy snapshots and button coverage
        run: node tools/check-article-presentation.mjs
      - name: Worker dry-run build
        run: pnpm build
      - name: Regenerate Blogger theme and require clean diff
        run: |
          node tools/build-theme.mjs
          git diff --exit-code -- akkigo_blogger_r1_bundle/theme/blogger-theme-r1.xml
      - name: Validate Blogger XML
        run: node tools/validate-theme-xml.mjs
      - name: Mark exact verified source
        id: verified
        run: node tools/verification-certificate.mjs
