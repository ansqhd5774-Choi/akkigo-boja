name: Verify
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Regenerate Blogger theme and require clean diff
        run: |
          node tools/build-theme.mjs
          git diff --exit-code -- akkigo_blogger_r1_bundle/theme/blogger-theme-r1.xml
      - name: Render Shiba coupon layout at 390 and 1440
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "CHROME_NOT_FOUND"
            exit 1
          fi
          for width in 390 1440; do
            fixture="$RUNNER_TEMP/shiba-$width.html"
            dump="$RUNNER_TEMP/shiba-$width.dump.html"
            node tools/check-shiba-layout.mjs "$width" "$fixture"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --force-device-scale-factor=1 --window-size="$width,1200" --virtual-time-budget=2500 --dump-dom "file://$fixture" > "$dump"
            if ! grep -q 'data-layout-result="PASS"' "$dump"; then
              grep -o 'data-layout-failures="[^"]*"' "$dump" || true
              exit 1
            fi
            echo "LAYOUT_OK_$width"

            feed_fixture="$RUNNER_TEMP/shiba-feed-$width.html"
            feed_dump="$RUNNER_TEMP/shiba-feed-$width.dump.html"
            node tools/check-shiba-feed-layout.mjs "$width" "$feed_fixture"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --force-device-scale-factor=1 --window-size="$width,900" --virtual-time-budget=800 --dump-dom "file://$feed_fixture" > "$feed_dump"
            if ! grep -q 'data-feed-result="PASS"' "$feed_dump"; then
              grep -o 'data-feed-failures="[^"]*"' "$feed_dump" || true
              exit 1
            fi
            echo "FEED_LAYOUT_OK_$width"
          done
      - name: Validate Blogger XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in [
              'theme/blogger-native-base.xml',
              'akkigo_blogger_r1_bundle/theme/blogger-theme-r1.xml',
              'akkigo_blogger_r1_bundle/theme/blogger-theme-r1_modified.xml',
          ]:
              ET.parse(path)
              print('XML_OK', path)
          PY
