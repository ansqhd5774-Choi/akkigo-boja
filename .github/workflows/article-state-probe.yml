name: Article Publish State Probe
on:
  workflow_dispatch:
    inputs:
      article_key:
        description: Article key to inspect in D1
        required: true
        type: string
        default: nomad-esim-promo-202610
  push:
    branches: [codex/blogger-worker-r1]
    paths:
      - .github/workflows/article-state-probe.yml
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  probe:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ARTICLE_KEY: ${{ inputs.article_key || 'nomad-esim-promo-202610' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - name: Read requested article state only
        run: |
          if ! printf '%s' "$ARTICLE_KEY" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo 'INVALID_ARTICLE_KEY'
            exit 1
          fi
          pnpm exec wrangler d1 execute akkigo-boja-state --remote --json --command "SELECT article_key,post_id,public_url,status,updated_at FROM article_state WHERE article_key='$ARTICLE_KEY'; SELECT article_key,operation,status,error_code,started_at,finished_at FROM article_publish_attempts WHERE article_key='$ARTICLE_KEY' ORDER BY started_at DESC LIMIT 10;"
