name: Article Publish State Probe
on:
  push:
    branches: [codex/blogger-worker-r1]
    paths:
      - .github/workflows/article-state-probe.yml
permissions:
  contents: read
  id-token: write
defaults:
  run:
    shell: bash
jobs:
  probe:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - name: Read Nomad article state only
        run: |
          pnpm exec wrangler d1 execute akkigo-boja-state --remote --json --command "SELECT article_key,post_id,public_url,status,updated_at FROM article_state WHERE article_key='nomad-esim-promo-202610'; SELECT article_key,operation,status,error_code,started_at,finished_at FROM article_publish_attempts WHERE article_key='nomad-esim-promo-202610' ORDER BY started_at DESC LIMIT 5;"
      - name: Request GitHub OIDC token
        id: oidc
        run: node tools/actions-runtime.mjs oidc
      - name: Compare Nomad with Blogger read-only identity
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.GITHUB_OIDC_TOKEN;
          const response=await fetch('https://akkigo-boja.ansqhd5774.workers.dev/internal/articles/preflight',{
            method:'POST',
            headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
            body:JSON.stringify({articleKey:'nomad-esim-promo-202610',readOnlyLive:true}),
            signal:AbortSignal.timeout(120000)
          });
          const text=await response.text();
          console.log('NOMAD_BLOGGER_READONLY_HTTP',response.status);
          console.log('NOMAD_BLOGGER_READONLY_BODY',text);
          if(!response.ok)process.exit(1);
          NODE
