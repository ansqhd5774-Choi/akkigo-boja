name: Verify Game Icons
on:
  workflow_dispatch:
    inputs:
      games:
        description: 'Comma-separated game IDs, or all (see tools/check-game-icons.mjs)'
        required: true
        type: string
        default: aqualand
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  icons:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Check selected official icons sequentially
        env:
          ICON_GAMES: ${{ inputs.games }}
        run: node tools/check-game-icons.mjs
