name: Lookup Top Force Official App Icon
on:
  push:
    branches: [codex/blogger-worker-r1]
    paths: [.github/workflows/lookup-top-force-icon.yml]
permissions:
  contents: read
defaults:
  run:
    shell: cmd
jobs:
  icon:
    runs-on: [self-hosted, Windows, X64, akkigo-boja]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Resolve official Apple artwork for app ID 6761893238
        run: node tools/icon-checks/lookup-top-force-icon.mjs
